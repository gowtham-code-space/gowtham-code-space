<svg xmlns="http://www.w3.org/2000/svg" width="400" height="40" viewBox="0 0 400 40">
  <rect width="400" height="40" fill="#0D1117"/>

  <!-- Node 1 -->
  <circle cx="12" cy="20" r="5" fill="#262C34">
    <animate attributeName="fill" values="#262C34;#3FE08A;#3FE08A;#3FE08A;#262C34" keyTimes="0;0.1;0.5;0.9;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="filter" values="none;url(#glow);url(#glow);url(#glow);none" keyTimes="0;0.1;0.5;0.9;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Label: Build -->
  <text x="22" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8B949E">Build</text>

  <!-- Connector line 1 -->
  <line x1="58" y1="20" x2="80" y2="20" stroke="#1F2630" stroke-width="1.5"/>

  <!-- Node 2 -->
  <circle cx="87" cy="20" r="5" fill="#262C34">
    <animate attributeName="fill" values="#262C34;#262C34;#3FE08A;#3FE08A;#262C34" keyTimes="0;0.25;0.42;0.9;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Label: Test -->
  <text x="97" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8B949E">Test</text>

  <!-- Connector line 2 -->
  <line x1="126" y1="20" x2="148" y2="20" stroke="#1F2630" stroke-width="1.5"/>

  <!-- Node 3 -->
  <circle cx="155" cy="20" r="5" fill="#262C34">
    <animate attributeName="fill" values="#262C34;#262C34;#262C34;#3FE08A;#262C34" keyTimes="0;0.42;0.58;0.75;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Label: Projects -->
  <text x="165" y="25" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#ffffff">Projects</text>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
